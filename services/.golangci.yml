# golangci-lint v2 — strict set. internal/broker is the containment chokepoint,
# so gosec/errorlint/errcheck earn their keep here.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - unconvert
    - revive
    - gocritic
    - gosec
    - bodyclose
    - errorlint
    - nilerr

  exclusions:
    rules:
      # gosec only, and only in tests: fixtures set share-readable perms (the S7
      # probe writes 0644 dirs/files the non-root guest reads back over the share —
      # same cross-uid constraint as the Files door) and read back their own temp
      # outputs. These are test fixtures, not a security boundary. errcheck,
      # errorlint, and unconvert stay ON for tests — those are fixed, not excluded.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
